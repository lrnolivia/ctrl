name: ctrl quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
# Cancel obsolete PR validation, while preserving every main-branch run.
concurrency:
  group: ctrl-quality-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      CTRL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node test/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctrl-preview-${{ github.sha }}
          path: |
            qa-evidence/
            dist/
          if-no-files-found: warn

name: ctrl quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node test/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctrl-preview-${{ github.sha }}
          path: |
            qa-evidence/
            dist/
          if-no-files-found: warn
